<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="web.mjs"></script>
    <title>Days Calendar</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Days Calendar</h1>
    </header>
    <main>
      <h2 id="month-year-heading"></h2>

      <button type="button" id="previous-month-btn">Previous</button>

      <!-- "Jump to" controls -->
      <label for="month-select">Month</label>
      <select id="month-select">
        <option value="0">January</option>
        <option value="1">February</option>
        <option value="2">March</option>
        <option value="3">April</option>
        <option value="4">May</option>
        <option value="5">June</option>
        <option value="6">July</option>
        <option value="7">August</option>
        <option value="8">September</option>
        <option value="9">October</option>
        <option value="10">November</option>
        <option value="11">December</option>
      </select>

      <!-- year control -->
      <label for="year-input">Year</label>
      <input type="number" id="year-input" />

      <button type="button" id="next-month-btn">Next</button>

      <div id="weekday-headings">
        <div>Sunday</div>
        <div>Monday</div>
        <div>Tuesday</div>
        <div>Wednesday</div>
        <div>Thursday</div>
        <div>Friday</div>
        <div>Saturday</div>
      </div>

      <div id="calendar-grid"></div>
    </main>
    <footer>
      &copy; Project Days Calendar - Project by Dipa Sarker and Edina Kurdi
    </footer>
  </body>
</html>
